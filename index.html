<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11100d">
  <title>Tourabi | روابط التواصل</title>
  <style>
    :root { color-scheme: dark; --gold:#d9ad4a; --gold2:#f3d88b; --ink:#11100d; --panel:#1b1812; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; font-family:Tahoma,Arial,sans-serif; color:#fff7de; background:radial-gradient(circle at top,#42331a 0,#18150f 36%,#090908 100%); }
    main { width:min(100%,460px); padding:38px 24px 30px; border:1px solid #9f7a2e; border-radius:28px; text-align:center; background:linear-gradient(145deg,rgba(42,35,22,.97),rgba(14,13,11,.98)); box-shadow:0 22px 70px #000a, inset 0 0 40px #d9ad4a12; }
    .mark { width:76px; height:76px; margin:auto; display:grid; place-items:center; border:2px solid var(--gold); border-radius:50%; color:var(--gold2); font-size:28px; font-weight:700; box-shadow:0 0 28px #d9ad4a33; }
    h1 { margin:18px 0 6px; color:var(--gold2); letter-spacing:.5px; font-size:29px; }
    p { margin:0 0 26px; color:#d7c89f; font-size:15px; }
    nav { display:grid; gap:13px; }
    a,.soon { min-height:58px; display:flex; align-items:center; justify-content:center; gap:10px; padding:14px 18px; border-radius:16px; font-weight:700; font-size:17px; }
    a { color:#17130b; text-decoration:none; background:linear-gradient(135deg,var(--gold2),#c38c24); box-shadow:0 8px 20px #0006; transition:transform .18s,filter .18s; }
    a:hover { transform:translateY(-2px); filter:brightness(1.08); }
    a:focus-visible { outline:3px solid white; outline-offset:3px; }
    .soon { border:1px dashed #8c733f; color:#aa9c7a; background:#ffffff08; }
    footer { margin-top:25px; color:#8d8167; font-size:12px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">T</div>
    <h1>Tourabi | YouTube</h1>
    <p>مرحبًا بكم — اختر الوجهة التي تريد زيارتها</p>
    <nav aria-label="روابط Tourabi">
      <a href="https://www.google.com/maps?q=33.562528,-7.532639" target="_blank" rel="noopener">📍 الموقع على Google Maps</a>
      <a href="https://youtube.com/@tourabikaysar" target="_blank" rel="noopener">▶️ قناة YouTube</a>
      <a href="https://www.facebook.com/abdrrahim.tourabi?rdid=V4WJ5XZkgtgmpWDg&amp;share_url=https%3A%2F%2Fwww.facebook.com%2Fshare%2F18AamakMjt%2F%23" target="_blank" rel="noopener">📘 صفحة Facebook</a>
      <div class="soon" aria-disabled="true">🌐 الموقع الإلكتروني — قريبًا</div>
    </nav>
    <footer>Tourabi © 2026</footer>
  </main>
</body>
</html>
